<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="60%" stop-color="#0B5CAB" />
      <stop offset="100%" stop-color="#0A2E4D" />
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B5CAB" />
      <stop offset="100%" stop-color="#4FC3F7" />
    </linearGradient>
  </defs>

  <!-- Snowflake Icon Emblem -->
  <g transform="translate(60,60) scale(0.55)">
    <!-- 6 Primary Axes -->
    <g id="full-branch">
      <path d="M 0,-15 L 0,-75" stroke="url(#brandBlue)" stroke-width="8" stroke-linecap="round" />
      <path d="M -18,-55 L 0,-72 L 18,-55" fill="none" stroke="#4FC3F7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -22,-35 L 0,-52 L 22,-35" fill="none" stroke="url(#brandBlue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="0,-84 -7,-72 0,-60 7,-72" fill="#4FC3F7" />
    </g>
    <use href="#full-branch" transform="rotate(60)" />
    <use href="#full-branch" transform="rotate(120)" />
    <use href="#full-branch" transform="rotate(180)" />
    <use href="#full-branch" transform="rotate(240)" />
    <use href="#full-branch" transform="rotate(300)" />
    
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#brandBlue)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#4FC3F7" />
  </g>

  <!-- Text "JPM" -->
  <text x="135" y="70" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="#0A2E4D" letter-spacing="-1">JPM</text>

  <!-- Text "CLIMATIZAÇÃO" -->
  <text x="255" y="70" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="34" fill="#0B5CAB" letter-spacing="1">CLIMATIZAÇÃO</text>
  
  <!-- Subtitle Line -->
  <text x="137" y="96" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" fill="#5B6B79" letter-spacing="4">CONFORTO TÉRMICO &amp; REFRIGERAÇÃO</text>
</svg>
