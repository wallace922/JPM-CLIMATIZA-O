<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="50%" stop-color="#0B5CAB" />
      <stop offset="100%" stop-color="#0A2E4D" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#4FC3F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4" />
  
  <!-- Snowflake Center Emblem -->
  <g transform="translate(100,100)">
    <!-- 6 Primary Axes -->
    <g id="branch">
      <!-- Main Stem -->
      <path d="M 0,-15 L 0,-75" stroke="url(#iceGrad)" stroke-width="7" stroke-linecap="round" />
      <!-- Top Chevron -->
      <path d="M -18,-55 L 0,-72 L 18,-55" fill="none" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Middle Chevron -->
      <path d="M -22,-35 L 0,-52 L 22,-35" fill="none" stroke="url(#iceGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Diamond Tip -->
      <polygon points="0,-82 -6,-72 0,-62 6,-72" fill="url(#cyanGlow)" />
    </g>
    
    <use href="#branch" transform="rotate(60)" />
    <use href="#branch" transform="rotate(120)" />
    <use href="#branch" transform="rotate(180)" />
    <use href="#branch" transform="rotate(240)" />
    <use href="#branch" transform="rotate(300)" />
    
    <!-- Hexagonal Core -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#iceGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Inner Star -->
    <circle cx="0" cy="0" r="8" fill="url(#cyanGlow)" />
  </g>
</svg>
